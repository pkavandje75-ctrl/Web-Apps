<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="scrip.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="main-box">
        <input class="city-input" placeholder="Digite o nome da cidade">
        <button onclick="getCityName()" class="search-button">
            <img class="imgSearch" src="img/lupaIcon.png" alt="icone-de-pesquisa">
        </button>
        <div class="midle-box">
            <h2 class="city">Tempo em </h2>
            <p class="temperature">21°C</p>
            <div class="weather-box">
                <img class="prevision" alt="icone-do-tempo" src="img/darkCloud.png">
                <p class="description">Nublado</p>
            </div>
            <p class="humidity">Umidade: 76%</p>
        </div>


    </div>
</body>

</html>
